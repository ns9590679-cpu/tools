<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Product Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    header {
      background: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 250px;
      margin: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }
    .product-card:hover {
      transform: scale(1.05);
    }
    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #ddd;
    }
    .product-card h3 {
      margin: 10px 0;
    }
    .product-card p {
      color: #555;
      font-size: 14px;
      padding: 0 10px;
    }
    .price {
      font-size: 18px;
      color: #e91e63;
      font-weight: bold;
      margin: 10px 0;
    }
    .buy-btn {
      display: inline-block;
      padding: 10px 20px;
      margin: 10px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .buy-btn:hover {
      background: #e91e63;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Product Store</h1>
  </header>

  <div class="container">
    <!-- Product 1 -->
    <div class="product-card">
      <img src="product1.jpg" alt="Product 1">
      <h3>Product Name 1</h3>
      <p>This is the description of product 1. You can write details here.</p>
      <div class="price">₹999</div>
      <a href="#" class="buy-btn">Buy Now</a>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
      <img src="product2.jpg" alt="Product 2">
      <h3>Product Name 2</h3>
      <p>This is the description of product 2. You can write details here.</p>
      <div class="price">₹1499</div>
      <a href="#" class="buy-btn">Buy Now</a>
    </div>
  </div>
</body>
</html>
